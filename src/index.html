<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Pomodoro Accessibilité</title>
  <base href="/">
  <!-- viewport-fit=cover : sans lui, env(safe-area-inset-*) vaut 0 sur iOS et le contenu passe sous la barre d'état -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Minuteur Pomodoro visuel pensé pour le TDAH.">
  <meta name="theme-color" content="#a6ccd6">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!--
    Premier affichage : le fond et le logo sont en ligne, pour qu'aucun blanc ne
    s'affiche le temps que le JavaScript et la feuille de style arrivent. Angular remplace le
    contenu de <app-root> dès qu'il démarre : l'indicateur disparaît tout seul.
  -->
  <script>
    try {
      var saved = localStorage.getItem('pomodoro-tdah.theme');
      var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('boot-dark');
    } catch (e) {}
  </script>
  <style>
    html { background: #f5f2ea; }
    html.boot-dark { background: #1b1f23; }
    .boot-logo {
      position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
    }
    .boot-logo svg {
      animation: boot-pulse 1.4s ease-in-out infinite;
    }
    .boot-version {
      position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 24px);
      text-align: center; font: 500 12px/1 -apple-system, system-ui, sans-serif; color: #5b6b7a;
    }
    .boot-version:empty { display: none; }
    html.boot-dark .boot-version { color: #a0abb1; }
    @keyframes boot-pulse { 50% { transform: scale(0.94); opacity: 0.85; } }
    @media (prefers-reduced-motion: reduce) { .boot-logo svg { animation: none; } }
  </style>
</head>
<body>

</html>
