<main
  class="stage"
  [class.sport]="session.sportMode()"
  [class.table]="session.tableMode()"
  [style.--sport-c]="session.selectedPreset().color"
>
  <h1 class="sr-only">Pomodoro Accessibilité</h1>
  <!-- Zone d'annonces vocales pour lecteurs d'écran -->
  <div aria-live="polite" aria-atomic="true" class="sr-only" id="a11y-announcements">{{ session.announcement() }}</div>

  <!-- Signal visuel des paliers et de la fin : décoratif pour les lecteurs d'écran,
       qui reçoivent déjà le message par la zone d'annonces ci-dessus. -->
  <div
    *ngIf="session.visualCue() as cue"
    class="cue"
    [class.cue-end]="cue === 'end'"
    [class.cue-strong]="prefs.visualAlert() === 'strong'"
    [style.--c]="session.selectedPreset().color"
    aria-hidden="true"
  ></div>

<!-- Derrière la modale, tout devient inerte : sinon la tabulation en sort,
       alors que le panneau se déclare aria-modal -->
  <div class="stage-content" [attr.inert]="showSheet || showTutorial() ? '' : null">
    <!--
      Sortie du mode table : premier dans l'ordre de tabulation, discrète mais nommée en
      toutes lettres — un mode sans porte de sortie visible est un piège.
    -->
    <button
      *ngIf="session.tableMode()"
      type="button"
      class="table-exit"
      (click)="leaveTable()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 9 4 4m0 0v5m0-5h5" />
        <path d="m15 9 5-5m0 0v5m0-5h-5" />
        <path d="m9 15-5 5m0 0v-5m0 5h5" />
        <path d="m15 15 5 5m0 0v-5m0 5h-5" />
      </svg>
      {{ i18n.t('table.exit') }}
    </button>
    <!-- Reste affiché jusqu'à la prochaine action : une alerte qui passe se rate. -->
    <p class="end-banner" *ngIf="showEndBanner()" [style.--c]="session.selectedPreset().color">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7" />
        <path d="M13.7 20a2 2 0 0 1-3.4 0" />
      </svg>
      {{ i18n.t('notif.endTitle') }}
    </p>

    <app-timer-dial />
    <app-timer-readout />
    <app-routine-strip />
    <app-timer-controls (openSettings)="openSheet()" />

    <a
      routerLink="/accessibility"
      class="accessibility-link"
      [attr.title]="i18n.t('action.accessibilityInfo')"
    >
      <span class="accessibility-icon" aria-hidden="true">♿</span>
      <!--
        Le RGAA demande que l'état de conformité soit mentionné à côté du lien, et non
        seulement dans la déclaration : « partiellement conforme » se lit donc ici.
      -->
      <span class="accessibility-label">{{ i18n.t('action.accessibilityMention') }}</span>
    </a>
  </div>

  <app-settings-sheet [open]="showSheet" (closed)="onSheetClosed()" />

  <!-- Au premier lancement seulement : cinq vues qui disent ce que fait l'application -->
  <app-tutorial *ngIf="showTutorial()" (closed)="onTutorialClosed()" />
</main>
