<div class="readout" [style.--c]="selectedPreset.color">
  <span class="readout-time">{{ formatTime(displaySeconds) }}</span>
  <span class="readout-mode">{{ modeName }}</span>
  <span class="readout-state">{{ stateLabel }}</span>
</div>
<div class="cycle" *ngIf="cycleLabel as cycle">
  <span class="cycle-dots" aria-hidden="true">
    <span
      *ngFor="let slot of cycleSlots; let i = index"
      class="cycle-dot"
      [class.done]="i < focusRounds % longBreakEvery"
      [style.--c]="selectedPreset.color"
    ></span>
  </span>
  {{ cycle }}
</div>
