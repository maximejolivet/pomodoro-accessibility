<div class="controls">
  <button
    type="button"
    class="btn3d btn-round"
    [attr.aria-disabled]="locked"
    (click)="resetTimer()"
    [attr.aria-label]="i18n.t('action.reset')"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
      <path d="M3 3v5h5" />
    </svg>
  </button>
  <button
    type="button"
    class="btn3d btn-main"
    [style.--c]="selectedPreset.color"
    (click)="toggle()"
    [attr.aria-label]="mainActionLabel"
  >
    <svg *ngIf="!isRunning" viewBox="0 0 24 24" aria-hidden="true" class="icon-play">
      <path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z" />
    </svg>
    <svg *ngIf="isRunning" viewBox="0 0 24 24" aria-hidden="true" class="icon-pause">
      <rect x="6" y="5" width="4.5" height="14" rx="1.5" />
      <rect x="13.5" y="5" width="4.5" height="14" rx="1.5" />
    </svg>
  </button>
  <button type="button" class="btn3d btn-round" #settingsButton (click)="openSettings.emit()" [attr.aria-label]="i18n.t('action.settings')">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" />
    </svg>
  </button>
</div>

<!-- L'état sous le lecteur, là où se porte le regard quand on démarre ou met en pause. -->
<p class="state">{{ stateLabel }}</p>
