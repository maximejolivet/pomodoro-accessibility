<div class="tilt-zone">
  <div class="case-shadow">
  <div class="device">
    <div class="bezel">
      <button
        type="button"
        class="face"
        role="slider"
        [attr.aria-valuemin]="1"
        [attr.aria-valuemax]="maxMinutes"
        [attr.aria-valuenow]="Math.ceil(displayUnits)"
        [attr.aria-valuetext]="dialText"
        [attr.aria-disabled]="locked"
        [attr.aria-readonly]="inSeconds ? 'true' : null"
        [class.dragging]="isDragging"
        (click)="onFaceClick()"
        (pointerdown)="onDragStart($event)"
        (pointermove)="onDragMove($event)"
        (pointerup)="onDragEnd($event)"
        (pointercancel)="onDragEnd($event)"
        (keydown.arrowLeft)="stepMinutes(-1)"
        (keydown.arrowRight)="stepMinutes(1)"
        (keydown.pageUp)="stepMinutes(-5)"
        (keydown.pageDown)="stepMinutes(5)"
        (keydown.home)="setMinutes(0)"
        (keydown.end)="setMinutes(maxMinutes)"
        [attr.aria-label]="i18n.t('action.dialName')"
        aria-describedby="dial-hint"
      >
        <svg #dial viewBox="0 0 420 420" class="dial" aria-hidden="true">
          <defs>
            <radialGradient id="diskGrad" cx="50%" cy="40%" r="65%">
              <stop offset="0%" [attr.stop-color]="selectedPreset.color" stop-opacity="0.85" />
              <stop offset="100%" [attr.stop-color]="selectedPreset.color" />
            </radialGradient>
            <radialGradient id="knobGrad" cx="38%" cy="32%" r="75%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="55%" stop-color="#eef3f6" />
              <stop offset="100%" stop-color="#c9d6dc" />
            </radialGradient>
            <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1c1030" flood-opacity="0.3" />
            </filter>
            <!-- Fondu de l'effet d'arrière-plan, du 0 vers le 20 -->
            <linearGradient
              id="bgFadeGrad"
              gradientUnits="userSpaceOnUse"
              [attr.x1]="bgFade.start.x" [attr.y1]="bgFade.start.y"
              [attr.x2]="bgFade.end.x" [attr.y2]="bgFade.end.y"
            >
              <stop offset="0%" stop-color="#fff" />
              <stop offset="60%" stop-color="#fff" stop-opacity="0.7" />
              <stop offset="100%" stop-color="#fff" stop-opacity="0" />
            </linearGradient>
            <mask id="bgFadeMask" maskUnits="userSpaceOnUse" x="-100" y="-100" width="620" height="620">
              <rect x="-100" y="-100" width="620" height="620" fill="url(#bgFadeGrad)" />
            </mask>
            <!-- Relief de la zone : ombre douce sous le bord, comme un rebord en plastique -->
            <filter id="bandRelief" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0.5" dy="2" stdDeviation="2.2" class="band-shadow" />
            </filter>
            <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="0.8" />
            </filter>
            <radialGradient id="bandGrad" gradientUnits="userSpaceOnUse" [attr.cx]="cx" [attr.cy]="cy" r="212">
              <stop offset="70%" class="band-stop-in" />
              <stop offset="100%" class="band-stop-out" />
            </radialGradient>
            <filter id="knobShadow" x="-60%" y="-60%" width="220%" height="220%">
              <feDropShadow dx="1" dy="5" stdDeviation="4" flood-color="#0d2530" flood-opacity="0.45" />
            </filter>
          </defs>

          <g [attr.transform]="dialTransform">
          <!-- Effet d'arrière-plan de 0 à 20 -->
          <g mask="url(#bgFadeMask)">
            <g>
              <path [attr.d]="bgFillPath" style="fill: var(--band-in)" />
              <path [attr.d]="bgArcPath" class="bg-line" />
            </g>
            <path [attr.d]="bgHighlightPath" class="bg-highlight" />
          </g>

          <!-- Anneau de couleurs -->
          <path *ngFor="let s of segments" [attr.d]="s.d" [attr.fill]="s.color" />

          <!-- Disque : voile sur l'anneau puis plateau plein au centre -->
          <path [attr.d]="diskOuterPath" [attr.fill]="selectedPreset.color" class="disk-veil" />
          <g>
            <path [attr.d]="diskInnerPath" [attr.fill]="selectedPreset.color" />
          </g>

          <!-- Séparateurs blancs -->
          <line
            *ngFor="let l of separators"
            [attr.x1]="l.x1" [attr.y1]="l.y1" [attr.x2]="l.x2" [attr.y2]="l.y2"
            class="separator"
          />

          <!-- Graduations de l'horloge : 60, épaisses toutes les 5 minutes -->
          <line
            *ngFor="let t of ticks"
            [attr.x1]="t.x1" [attr.y1]="t.y1" [attr.x2]="t.x2" [attr.y2]="t.y2"
            class="tick"
            [class.major]="t.major"
          />

          <!-- Bord du disque -->
          <line
            *ngIf="displayMinutes > 0 && displayMinutes < 60"
            [attr.x1]="cx" [attr.y1]="cy" [attr.x2]="edgeLine.x" [attr.y2]="edgeLine.y"
            class="edge"
          />
          <g [attr.transform]="'translate(' + cx + ' ' + cy + ') rotate(' + edgeAngle + ')'">
            <circle cx="0" cy="-180" r="30" class="disk-tab" [style.fill]="selectedPreset.color" />
          </g>

          <!-- Chiffres -->
          <text
            *ngFor="let t of labels"
            [attr.x]="t.x" [attr.y]="t.y"
            class="label"
          >{{ t.text }}</text>

          <!--
            L'unité, seulement quand ce ne sont plus des minutes : sans elle, un cadran
            réglé sur 20 secondes se lit 20 minutes. Les chiffres, eux, valent pour les deux.
          -->
          <text *ngIf="inSeconds" [attr.x]="cx" [attr.y]="cy + 66" class="unit">
            {{ i18n.t('unit.secShort') }}
          </text>

          <!-- Bouton central -->
          <g>
            <circle [attr.cx]="cx" [attr.cy]="cy" r="31" class="gasket" />
            <g [attr.transform]="'translate(' + cx + ' ' + cy + ') rotate(' + edgeAngle + ')'">
              <rect x="-6" y="-47" width="12" height="26" rx="6" fill="#ffffff" />
            </g>
            <circle [attr.cx]="cx" [attr.cy]="cy" r="26" fill="#ffffff" />
            <ellipse [attr.cx]="cx - 7" [attr.cy]="cy - 9" rx="10" ry="6" class="knob-shine" />
          </g>
          </g>
        </svg>
      </button>
    </div>
  </div>
  </div>

  <!--
    Verrou posé au bas du boîtier : hors du cadran qu'il protège, pour qu'on ne le touche
    pas en le réglant. Icône seule, nommée pour les lecteurs d'écran et les infobulles.
  -->
  <button
    type="button"
    class="lock"
    [class.on]="locked"
    [attr.aria-label]="i18n.t(locked ? 'action.unlock' : 'action.lock')"
    [attr.title]="i18n.t(locked ? 'action.unlock' : 'action.lock')"
    [style.--c]="selectedPreset.color"
    (click)="toggleLock()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="4.5" y="10.5" width="15" height="10.5" rx="2.5" />
      <path *ngIf="locked" d="M8 10.5V7a4 4 0 0 1 8 0v3.5" />
      <path *ngIf="!locked" d="M8 10.5V7a4 4 0 0 1 7.6-1.7" />
    </svg>
  </button>
</div>
<span id="dial-hint" class="sr-only">{{ i18n.t('action.dialHint') }}</span>
